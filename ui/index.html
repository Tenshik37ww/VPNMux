<script>

const PROT={amneziawg:['AmneziaWG 1.x','AWG 1','Обфусцированный WireGuard'],amneziawg2:['AmneziaWG 2.0','AWG 2','Диапазоны H, S3/S4 и CPS-пакеты'],hysteria2:['Hysteria2','HY2','Быстрый туннель поверх QUIC'],openvpn:['OpenVPN','OVPN','Классический TLS-туннель']};

  save:async(name,t)=>{const g=k=>(t.match(new RegExp('^'+k+' = "([^"]*)"','m'))||[])[1]||'';const ep=g('endpoint')||g('server'),hh=[...ep].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);const p={id:'p'+Date.now(),name,protocol:g('protocol'),endpoint:ep,lat:hh%120-60,lon:hh*7%340-170,place:'Демо-координаты'};const l=ls.get('vm.demo',DEMO);l.unshift(p);ls.set('vm.demo',l);return p},

let P=[],sel=null,proto='all',cs=idle('idle'),stopping=false,poll=null,me=null;

function parseConf(t,fn){

const ACT=['starting','downloading','connecting','up'],act=()=>ACT.includes(cs.phase),cur=()=>P.find(p=>p.id==(act()?cs.id:sel))||null,fm=n=>String(n).padStart(2,'0');
